[project]
name = "msim"
version = "1.0.8"
description = "MCP Server Integration Manager for AnythingLLM"
readme = "README.md"
requires-python = ">=3.10"
authors = [
{name = "Gian Baring", email = "gian@example.com"}
]
license = {text = "MIT"}
dependencies = [
"uvicorn>=0.30.0",
"fastapi>=0.110.0",
"sse-starlette>=1.6.0",
"python-dotenv>=1.0.0",
"psutil>=5.9.0",
"websockets>=12.0",
"mcp<2",                      # pin to v1 for compatibility with the wrapper
]

[project.scripts]
msim = "MSIM:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]

# No dev-dependencies; we use dependency-groups.dev instead

[dependency-groups]
dev = [
	"cryptography>=42.0.0",
	"pytest>=8.0.0",
]