name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python compilation
        run: uv run python -m py_compile MSIM.py submodules/anythingllm-mcp/anythingllm_mcp.py

      - name: Run tests
        run: uv run pytest tests submodules/anythingllm-mcp/tests

      - name: Check lockfile
        run: uv lock --check